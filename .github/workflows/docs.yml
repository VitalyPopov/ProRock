# The site (docs/), built with Zensical: on a release branch only built, as a check; from main also published on GitHub Pages
name: Docs

on:
  push:
    branches: [main, '[0-9]*.[0-9]*'] # main and the release branches (1.8, 1.9, 1.10...)
    paths: [docs/**, ROADMAP.md, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical==0.1.4
      # ROADMAP.md and CHANGELOG.md stay in the repository root; the site gets copies
      - run: |
          { printf -- '---\nicon: lucide/map\n---\n\n'; sed 's/(CHANGELOG\.md)/(changelog.md)/g' ROADMAP.md; } > docs/pages/roadmap.md
          { printf -- '---\nicon: lucide/history\nhide:\n  - toc\n---\n\n'; cat CHANGELOG.md; } > docs/pages/changelog.md
      - run: zensical build --clean
        working-directory: docs
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
