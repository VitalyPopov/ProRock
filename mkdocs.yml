site_name: ProRock
site_description: "Schema-typed XML for Delphi: generate exact classes from XSD and WSDL. When the schema changes, regenerate, don't re-patch."
site_url: https://prorock.rocks/
repo_url: https://github.com/VitalyPopov/ProRock
repo_name: VitalyPopov/ProRock
edit_uri: edit/main/docs/
copyright: © 2026 Vitaly Popov. ProRock is licensed under the Apache License 2.0. ProRocket Lite is a free closed-source tool with its own license.

theme:
  name: material
  favicon: assets/favicon.svg
  palette: # dark first: the default for a first visit; the button switches, and the browser remembers the choice
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: "#"
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Start:
      - How it works: how-it-works.md
      - Getting started: getting-started.md
      - Samples: samples.md
  - Generator:
      - prorocket-lite/index.md
      - GUI: gui.md
      - Command line: cli.md
      - Generated code: generated-code.md
  - Using the classes:
      - XML (Xmlite): xmlite.md
      - SOAP (Soapite): soapite.md
      - Large documents: large-documents.md
      - Hand-written classes: hand-written.md
  - Reference:
      - Tested schemas: tested-schemas.md
      - XML support: xml-support.md
      - Limitations and notes: limitations.md
  - Background:
      - Design principles: principles.md
      - XML for ProRockers: xml-concepts.md
  - Project:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
