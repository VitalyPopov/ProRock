site_name: ProRock
site_description: "Excel workbooks (.xlsx), XML and SOAP in plain Delphi objects; a free XSD and WSDL code generator."
site_url: https://prorock.rocks/
repo_url: https://github.com/VitalyPopov/ProRock
repo_name: VitalyPopov/ProRock
edit_uri: edit/main/docs/pages/
docs_dir: pages # what is published; mkdocs.yml and overrides/ beside it are not
copyright: © 2026 Vitaly Popov. ProRock is licensed under the Apache License 2.0. ProRocket Lite is a free closed-source tool with its own license.

theme:
  name: material
  custom_dir: overrides # the header drawn whole from the first paint (overrides/partials/header.html)
  font: false # the system font: nothing to download, so the text does not shift when a web font arrives
  favicon: assets/favicon.svg
  palette: # dark only: one theme to keep right (the author 2026-11-28)
    scheme: slate
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.highlight

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: "#"
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Start:
      - How it works: how-it-works.md
      - Getting started: getting-started.md
      - Samples: samples.md
  - Generator:
      - prorocket-lite/index.md
      - GUI: gui.md
      - Command line: cli.md
      - Generated code: generated-code.md
  - Using ProRock:
      - XML (Xmlite): xmlite.md
      - Excel (Calcite): calcite.md
      - SOAP (Soapite): soapite.md
      - Large documents: large-documents.md
      - Hand-written classes: hand-written.md
      - The core (Basite): basite.md
  - Reference:
      - Tested schemas: tested-schemas.md
      - XML support: xml-support.md
      - Limitations and notes: limitations.md
  - Background:
      - Design principles: principles.md
      - XML for ProRockers: xml-concepts.md
  - Project:
      - Roadmap: roadmap.md
      - Changelog: changelog.md
